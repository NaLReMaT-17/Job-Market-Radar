name: Update vacancy data

on:
  schedule:
    # Каждый день в 03:00 UTC = 06:00 МСК
    - cron: '0 3 * * *'
  workflow_dispatch:      # возможность запустить вручную из вкладки Actions

permissions:
  contents: write         # нужно, чтобы workflow мог сделать git push

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Чтобы push от бота не блокировал новые workflow-запуски
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect vacancies from Trudvsem
        run: python -m src.collect

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest.json data/latest.csv

          if git diff --cached --quiet; then
            echo "Нет изменений — коммит не нужен"
          else
            git commit -m "chore(data): auto-update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi